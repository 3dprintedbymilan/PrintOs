name: printos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printos}
      POSTGRES_USER: ${POSTGRES_USER:-printos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printos} -d ${POSTGRES_DB:-printos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"printos","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -ip=storage
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-printos}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-printos-secret}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - storage-data:/data

  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      - storage
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://storage:8333 s3api head-bucket --bucket $${S3_BUCKET} 2>/dev/null || aws --endpoint-url http://storage:8333 s3api create-bucket --bucket $${S3_BUCKET}; do
          echo "waiting for storage..."; sleep 2
        done
        echo "bucket $${S3_BUCKET} ready"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-printos}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-printos-secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-printos}
    restart: "no"

  api:
    build:
      context: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-printos};Username=${POSTGRES_USER:-printos};Password=${POSTGRES_PASSWORD:-printos}
      Database__MigrateOnStartup: "true"
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-3000}
      Storage__Endpoint: http://storage:8333
      Storage__Bucket: ${S3_BUCKET:-printos}
      Storage__AccessKey: ${S3_ACCESS_KEY:-printos}
      Storage__SecretKey: ${S3_SECRET_KEY:-printos-secret}
    ports:
      - "${API_PORT:-5000}:8080"

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:${API_PORT:-5000}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  storage-data:
